version: "3.9"

# AgroTrust AI – Infraestrutura de desenvolvimento completa
# Inclui: Kafka, Zookeeper, Redis, PostgreSQL, Schema Registry, Kafka UI

name: agrotrust-infra

networks:
  agrotrust-net:
    driver: bridge

volumes:
  pg_data:
  kafka_data:
  redis_data:

services:

  # ─── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: agrotrust-zookeeper
    networks: [agrotrust-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: agrotrust-kafka
    networks: [agrotrust-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── Schema Registry ───────────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: agrotrust-schema-registry
    networks: [agrotrust-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  # ─── Kafka UI (Observabilidade) ────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: agrotrust-kafka-ui
    networks: [agrotrust-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: agrotrust-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agrotrust-postgres
    networks: [agrotrust-net]
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema autoritativo da Fase 2 (o antigo docker/init-db.sql está obsoleto).
      # Mesmo arquivo aplicado por `make migrate`, e idempotente (IF NOT EXISTS).
      - ../core/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: agrotrust
      POSTGRES_USER: agrotrust
      POSTGRES_PASSWORD: agrotrust_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrotrust"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (cache de resultados ESG imutáveis) ─────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: agrotrust-redis
    networks: [agrotrust-net]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
