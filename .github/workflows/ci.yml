name: CI – AgroTrust AI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ─── Lint & Format ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  # ─── Type Check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install mypy pydantic pydantic-settings python-jose passlib cryptography structlog tenacity
      - name: Run mypy
        run: mypy core/ mocks/ --ignore-missing-imports

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system dependencies
        run: sudo apt-get install -y libgdal-dev gdal-bin
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov faker \
            fastapi httpx pydantic pydantic-settings \
            python-jose passlib cryptography structlog tenacity \
            pynacl scikit-learn shap xgboost \
            shapely geopandas pyproj \
            langchain-core langgraph
      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=core --cov=mocks --cov-report=xml --tb=short
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─── Contract Tests (mocks up) ───────────────────────────────────────────────
  contract-tests:
    name: Contract Tests (mocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio httpx fastapi uvicorn \
            pydantic pydantic-settings structlog \
            python-jose passlib cryptography tenacity pynacl faker
      - name: Run contract tests
        run: pytest tests/contract/ -v --tb=short

  # ─── SAST Security Scan ─────────────────────────────────────────────────────
  security-sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/secrets
            p/owasp-top-ten
          auditResults: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ─── Dependency Vulnerability Scan ──────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc --format json -o pip-audit-results.json || true
          cat pip-audit-results.json

  # ─── Docker Build Validation ────────────────────────────────────────────────
  docker-build:
    name: Docker Build (mocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build mock-sicar image
        run: |
          docker build -f docker/Dockerfile.mock \
            --build-arg MOCK_MODULE=mocks.sicar.app \
            --build-arg MOCK_PORT=8001 \
            -t agrotrust/mock-sicar:ci .
      - name: Build mock-dataprev image
        run: |
          docker build -f docker/Dockerfile.mock \
            --build-arg MOCK_MODULE=mocks.dataprev.app \
            --build-arg MOCK_PORT=8003 \
            -t agrotrust/mock-dataprev:ci .
