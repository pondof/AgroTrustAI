[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrotrust-ai"
version = "0.1.0"
description = "AgroTrust AI – SaaS Agêntico de Subscrição de Crédito Rural"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.optional-dependencies]
core = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "aiokafka>=0.10",
    "cryptography>=42",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "structlog>=24",
    "tenacity>=8.3",
]
ml = [
    "torch>=2.3",
    "transformers>=4.41",
    "langchain>=0.2",
    "langgraph>=0.1",
    "shap>=0.45",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "faker>=25",
    "testcontainers[kafka]>=4.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=core --cov=mocks --cov-report=term-missing -v"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "mocks*", "services*"]
