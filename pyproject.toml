[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrotrust-ai"
version = "0.1.0"
description = "AgroTrust AI – SaaS Agêntico de Subscrição de Crédito Rural"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.optional-dependencies]
core = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "aiokafka>=0.10",
    "cryptography>=42",
    "pynacl>=1.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "structlog>=24",
    "tenacity>=8.3",
]
ml = [
    "torch>=2.3",
    "transformers>=4.41",
    "langchain>=0.2",
    "langgraph>=0.1",
    "shap>=0.45",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "faker>=25",
    "testcontainers[kafka]>=4.5",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = [
    "S101",   # assert in tests
    "S105",   # hardcoded passwords (config/test values)
    "S106",   # hardcoded passwords
    "S311",   # random in mocks (não é uso criptográfico)
    "S104",   # binding 0.0.0.0 é intencional em serviços/Docker
    "N806",   # X, X_train etc são convenção padrão em ML
    "N815",   # camelCase em W3C VC Data Model (padrão do spec)
    "N999",   # diretórios de serviço com hífen (agent-esg etc) não são pacotes Python
    "UP042",  # str+Enum é padrão compatível com Pydantic v2
    "T201",   # print() em CLI tools (core/events/topics.py)
    "B008",   # Depends() como default é padrão oficial do FastAPI
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# Modo gradual: começar tolerante e endurecer ao longo das fases
check_untyped_defs = true
warn_unused_ignores = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=core --cov=mocks --cov=agents --cov-report=term-missing -v"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "mocks*", "services*", "agents*"]
