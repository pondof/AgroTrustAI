# AgroTrust AI – nginx para servir a SPA e fazer proxy da API ao gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Segurança: a app é self-contained (nada de CDN externo). 'unsafe-inline' em
    # style é necessário porque Recharts/Radix aplicam estilos inline; data: cobre
    # favicons e ícones embutidos. connect-src 'self' pois a API é same-origin (proxy).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy da API para o gateway (mesma origem → sem CORS no browser).
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Endpoint de login do gateway (fora do prefixo /api).
    location = /token {
        proxy_pass http://gateway:8000/token;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Ativos com hash no nome → cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota desconhecida serve o index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
