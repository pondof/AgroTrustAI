# =============================================================================
# AgroTrust AI – Template de Secret. NÃO popular este arquivo com valores reais.
#
# Em prod, gerar via:
#   - HashiCorp Vault + External Secrets Operator (ESO), ou
#   - Bitnami Sealed Secrets (kubeseal), ou
#   - AWS Secrets Manager + ESO.
#
# Os valores abaixo são placeholders REDACTED somente para validar o esquema.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: agrotrust-secrets
  namespace: agrotrust
  labels:
    app.kubernetes.io/part-of: agrotrust-ai
type: Opaque
stringData:
  # JWT signing secret (use chave RS256 privada em prod)
  SEC_JWT_SECRET: "REDACTED_USE_VAULT"

  # Master key AES-256 (32 bytes hex). Em prod: HSM/KMS.
  SEC_MASTER_KEY_HEX: "REDACTED_USE_HSM_OR_KMS"

  # Kafka SASL
  KAFKA_SASL_USERNAME: "REDACTED"
  KAFKA_SASL_PASSWORD: "REDACTED"

  # PostgreSQL DSN (asyncpg)
  DB_URL: "postgresql+asyncpg://REDACTED_USER:REDACTED_PASS@postgres.agrotrust.svc.cluster.local:5432/agrotrust"

  # API keys das APIs governamentais
  GOV_SICAR_API_KEY: "REDACTED"
  GOV_GEE_API_KEY: "REDACTED"
  GOV_DATAPREV_API_KEY: "REDACTED"
  GOV_OPENFINANCE_CLIENT_ID: "REDACTED"
  GOV_OPENFINANCE_CLIENT_SECRET: "REDACTED"
